apiVersion: apps/v1
kind: Deploymentmetadata:
name: analyzer-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analyzer
  template:
    metadata:
      labels:
        app: analyzer
    spec:
      containers:
      - name: analyzer
        image: yourdockerhub/file-analyzer-api
        ports:
        - containerPort: 5000
